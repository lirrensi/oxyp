name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: gofmt -l internal/ cmd/
      - run: test -z "$(gofmt -l internal/ cmd/)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test $(go list ./... | grep -v /zoo)

  bins:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags "-s -w" -o "oxyp-$GOOS-$GOARCH$ext" ./cmd/oxyp
      - uses: actions/upload-artifact@v4
        with:
          name: oxyp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: oxyp-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: bins
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bins
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: bins/oxyp-*
          generate_release_notes: true
